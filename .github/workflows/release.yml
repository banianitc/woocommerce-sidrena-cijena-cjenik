name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v1.3.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish WordPress package
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check tag matches plugin version
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' sidrena-cijena.php | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match plugin header version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint plugin PHP files
        shell: bash
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Run plugin static checks
        run: node ./tests/static-check.mjs

      - name: Build release package
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Verify release package
        shell: pwsh
        run: ./scripts/verify-release-archive.ps1 -ArchivePath "./dist/sidrena-cijena-v$env:VERSION.zip"

      - name: Extract release notes
        shell: bash
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md." > release-notes.md
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/sidrena-cijena-v$VERSION.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$archive" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
